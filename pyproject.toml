[project]
name = "factorio-ai-uv"
version = "0.1.0"
description = "Autonomous Factorio AI with Kruise_Kontrol_Remote, screen vision, and PPO"
readme = "README.md"
authors = [
    { name = "Luiso9", email = "muhandreop@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "stable-baselines3[extra]==2.7.1",
    "mss>=4.0.0",
    "numpy>=1.24.0,<2",
    "pillow>=10.0.0",
    "torch==2.5.1+cu118",
    "torchvision==0.20.1+cu118",
    "psutil>=5.9.0",
    "pygetwindow>=0.0.9",
    "factorio-rcon-py>=2.1.0",
]

[project.scripts]
factorio-ai-uv = "factorio_ai_uv:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"